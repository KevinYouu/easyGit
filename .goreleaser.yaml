version: 2

project_name: easyGit

dist: .builds

before:
  hooks:
    - go mod tidy

builds:
  - id: build_noncgo
    main: ./cmd/easygit
    binary: easyGit
    ldflags:
      - -s -w -X github.com/KevinYouu/easyGit/internal/version.Version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: archive_noncgo
    builds: [build_noncgo]
    format: zip
    files:
      - LICENSE

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^assets:'

snapshot:
  version_template: '{{ incpatch .Version }}'
